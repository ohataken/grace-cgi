openapi: 3.1.0
info:
  title: grace-cgi
  version: 1.0.0
  description: CGI API that lists the image files of each collection under /assets/collections/ and returns the SHA-256 of each file.
paths:
  /api/collections/{name}.json:
    get:
      operationId: listCollectionImages
      summary: List the files in a collection
      description: |
        Returns the files placed directly under `/assets/collections/{name}/`.

        - Entries are sorted by file name.
        - Only files are listed (symbolic links to files included). Subdirectories and
          files whose names start with `.` (such as `.DS_Store`) are excluded.
        - The file type is not checked, so non-image files are listed as well.
        - `path` is returned as-is without URL encoding.
      parameters:
        - name: name
          in: path
          required: true
          description: Name of the directory under `/assets/collections/`.
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]+$
          examples:
            cats:
              value: cats
            dogs:
              value: dogs
            rocks:
              value: rocks
      responses:
        '200':
          description: The collection exists. An empty directory returns an empty array.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollectionItem'
              examples:
                cats:
                  summary: /api/collections/cats.json
                  value:
                    - path: /assets/collections/cats/cats_1001.jpeg
                    - path: /assets/collections/cats/cats_1002.jpeg
                    - path: /assets/collections/cats/cats_1003.jpeg
                    - path: /assets/collections/cats/cats_1004.jpeg
                dogs:
                  summary: /api/collections/dogs.json
                  value:
                    - path: /assets/collections/dogs/dogs_1001.jpeg
                    - path: /assets/collections/dogs/dogs_1002.jpeg
                    - path: /assets/collections/dogs/dogs_1003.jpeg
                    - path: /assets/collections/dogs/dogs_1004.jpeg
                rocks:
                  summary: /api/collections/rocks.json
                  value:
                    - path: /assets/collections/rocks/rocks_1001.jpeg
                    - path: /assets/collections/rocks/rocks_1002.jpeg
                    - path: /assets/collections/rocks/rocks_1003.jpeg
                    - path: /assets/collections/rocks/rocks_1004.jpeg
        '404':
          description: |
            The collection was not found.

            - `application/json`: returned by the CGI when `name` matches the pattern
              but no such directory exists under `/assets/collections/`.
            - `text/html`: Apache's default error page, returned when `name` does not
              match the pattern and the request never reaches the CGI.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: not found
            text/html:
              schema:
                type: string
  /api/collections/{name}/{file}:
    get:
      operationId: getCollectionFile
      summary: Get the path and SHA-256 of a file in a collection
      description: |
        Returns the path and SHA-256 digest of `/assets/collections/{name}/{file}`.

        - Only files are accepted (symbolic links to files included). Subdirectories
          are treated as not found.
        - `file` must not start with `.`, so files such as `.DS_Store` are not served.
        - The digest is recomputed from the file contents on every request.
      parameters:
        - name: name
          in: path
          required: true
          description: Name of the directory under `/assets/collections/`.
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]+$
          example: cats
        - name: file
          in: path
          required: true
          description: Name of the file under `/assets/collections/{name}/`.
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-][A-Za-z0-9_.-]*$
          example: cats_1001.jpeg
      responses:
        '200':
          description: The file exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionFile'
              example:
                path: /assets/collections/cats/cats_1001.jpeg
                sha256: 35109b87e5645cdd742d11c9c8822b83f0591ddee3b31cf7c750d8d63bb662b8
        '404':
          description: |
            The file was not found.

            - `application/json`: returned by the CGI when `name` and `file` match their
              patterns but no such file exists under `/assets/collections/{name}/`.
            - `text/html`: Apache's default error page, returned when `name` or `file`
              does not match its pattern and the request never reaches the CGI.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: not found
            text/html:
              schema:
                type: string
components:
  schemas:
    CollectionItem:
      type: object
      required:
        - path
      properties:
        path:
          type: string
          description: Absolute URL path of the file.
          examples:
            - /assets/collections/cats/cats_1001.jpeg
      additionalProperties: false
    CollectionFile:
      type: object
      required:
        - path
        - sha256
      properties:
        path:
          type: string
          description: Absolute URL path of the file.
          examples:
            - /assets/collections/cats/cats_1001.jpeg
        sha256:
          type: string
          description: SHA-256 digest of the file contents as lowercase hex.
          pattern: ^[0-9a-f]{64}$
      additionalProperties: false
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          const: not found
      additionalProperties: false
